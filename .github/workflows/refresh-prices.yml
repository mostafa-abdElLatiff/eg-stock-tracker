name: Refresh market prices

on:
  schedule:
    # Cairo is UTC+2 year-round (no DST). EGX trading hours are 10:00-14:30
    # Cairo, Sun-Thu. Two cadences, not three:
    #
    # Gold (GoldAPI): no daily call cap, and the spot price genuinely moves
    # intraday, so it refreshes every 10 min across the whole session,
    # 08:00-12:30 UTC. A couple of runs land just after the 12:30 UTC
    # (14:30 Cairo) close - harmless, same closing price refetched.
    - cron: "*/10 8-12 * * 0-4"
    # Funds (snduk) AND stocks (EODHD) share this post-close schedule -
    # confirmed live that EODHD's free tier has no intraday EGX data at all
    # (real-time `close` comes back "NA"; only `previousClose` is usable),
    # so stocks only get a genuinely new number once a day anyway, same as
    # fund NAVs which settle after close. Twice a day catches a delayed
    # settlement on either source.
    - cron: "30 13 * * 0-4" # 15:30 Cairo - shortly after close
    - cron: "0 16 * * 0-4"  # 18:00 Cairo - later catch-up in case of a lag
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab - always does a full refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run refresh-prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
          # Gold always runs (cheap, no cap). Funds+stocks only run on the
          # post-close schedule - skipped on the 10-min gold-only trigger.
          # Manual workflow_dispatch runs (github.event.schedule is unset)
          # always do a full refresh.
          SKIP_EODHD: ${{ github.event.schedule == '*/10 8-12 * * 0-4' && 'true' || '' }}
          SKIP_FUNDS: ${{ github.event.schedule == '*/10 8-12 * * 0-4' && 'true' || '' }}
