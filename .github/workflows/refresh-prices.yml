name: Refresh market prices

on:
  schedule:
    # Cairo is UTC+2 year-round (no DST). EGX trading hours are 10:00-14:30
    # Cairo, Sun-Thu.
    #
    # Funds (snduk) + gold (GoldAPI): no meaningful daily call cap, so these
    # refresh every 10 min across the whole session, 08:00-12:30 UTC. A
    # couple of runs land just after the 12:30 UTC (14:30 Cairo) close -
    # harmless, same closing price refetched.
    - cron: "*/10 8-12 * * 0-4"
    # COMI/MASR/ETEL/CLHO/IBCT (EODHD): capped at 20 calls/day on the free
    # tier (5 tickers x this many runs), so these stay on the original sparse
    # schedule - open / mid-session / just-after-close - regardless of how
    # often the cron above fires. 5 x 3 = 15 calls/day, under the cap with
    # headroom for manual workflow_dispatch runs.
    - cron: "0 8,11,13 * * 0-4" # 10:00 / 13:00 / 15:00 Cairo
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab - always does a full refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run refresh-prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
          # The 10-min schedule only refreshes funds/gold - skip EODHD calls
          # on that trigger so the 5 stock tickers stay within the 20/day
          # free-tier cap. Manual runs and the 3x/day schedule do a full
          # refresh (this evaluates to empty/false for both).
          SKIP_EODHD: ${{ github.event.schedule == '*/10 8-12 * * 0-4' && 'true' || '' }}
